@if (disponible) {
  <button
    type="button"
    class="fullscreen-button"
    [attr.aria-label]="
      pleinEcran()
        ? 'Quitter le plein écran'
        : 'Passer en plein écran'
    "
    [title]="
      pleinEcran()
        ? 'Quitter le plein écran'
        : 'Passer en plein écran'
    "
    (click)="basculerPleinEcran()"
  >
    @if (pleinEcran()) {
      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" />
      </svg>
    } @else {
      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
      </svg>
    }
  </button>
}
